<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据挖掘期末复习站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--primary-light:#3b82f6;--primary-dark:#1d4ed8;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);text-align:center}
.sidebar-header h1{font-size:18px;color:var(--primary);margin-bottom:4px}
.sidebar-header p{font-size:12px;color:var(--text-secondary)}
.nav-section{padding:12px 0}
.nav-section-title{padding:8px 20px;font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px}
.nav-item{display:block;padding:10px 20px;font-size:14px;color:var(--text);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:#f1f5f9;color:var(--primary)}
.nav-item.active{background:#eff6ff;color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item .badge{float:right;background:var(--primary);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.main{margin-left:280px;flex:1;min-width:0}
.content{max-width:900px;margin:0 auto;padding:32px 40px 80px}
.menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:18px}

/* Hero */
.hero{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:var(--radius);padding:48px 40px;margin-bottom:32px}
.hero h2{font-size:28px;margin-bottom:8px}
.hero p{opacity:.9;font-size:15px}
.stats{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.15);border-radius:8px;padding:12px 20px;text-align:center;min-width:120px}
.stat-num{font-size:28px;font-weight:700}
.stat-label{font-size:12px;opacity:.85}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:20px;border:1px solid var(--border)}
.card h3{font-size:20px;margin-bottom:16px;color:var(--text);display:flex;align-items:center;gap:8px}
.card h4{font-size:16px;margin:20px 0 10px;color:var(--primary-dark)}
.card h5{font-size:14px;margin:14px 0 6px;color:var(--text)}
.card p,.card li{font-size:14px;color:var(--text-secondary);line-height:1.8}
.card ul,.card ol{padding-left:20px;margin:8px 0}
.card li{margin-bottom:4px}
.highlight{background:#fef3c7;border-left:4px solid var(--warning);padding:14px 18px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.highlight strong{color:var(--warning)}
.error-box{background:#fef2f2;border-left:4px solid var(--danger);padding:14px 18px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.error-box strong{color:var(--danger)}
.info-box{background:#eff6ff;border-left:4px solid var(--primary);padding:14px 18px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}

/* Chapter Grid */
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:20px 0}
.chapter-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s}
.chapter-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,.12);border-color:var(--primary)}
.chapter-card .num{display:inline-block;background:var(--primary);color:#fff;width:32px;height:32px;line-height:32px;text-align:center;border-radius:8px;font-size:14px;font-weight:700;margin-bottom:10px}
.chapter-card h4{font-size:15px;margin-bottom:6px;color:var(--text)}
.chapter-card p{font-size:12px;color:var(--text-secondary)}

/* Quiz */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.quiz-progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-secondary)}
.progress-bar{width:200px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--primary);transition:width .3s;border-radius:3px}
.quiz-score{font-size:14px;font-weight:600;color:var(--primary)}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.question-card.correct{border-color:var(--success);background:#f0fdf4}
.question-card.wrong{border-color:var(--danger);background:#fef2f2}
.q-type{display:inline-block;font-size:11px;padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q-type.choice{background:#dbeafe;color:var(--primary)}
.q-type.judge{background:#d1fae5;color:#059669}
.q-type.fill{background:#fef3c7;color:#d97706}
.q-type.essay{background:#ede9fe;color:#7c3aed}
.q-num{font-size:13px;color:var(--text-secondary);margin-bottom:6px}
.q-text{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text);line-height:1.7}
.options{list-style:none;padding:0}
.options li{padding:10px 14px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px;display:flex;align-items:center;gap:10px}
.options li:hover{border-color:var(--primary);background:#f0f7ff}
.options li.selected{border-color:var(--primary);background:#eff6ff;font-weight:500}
.options li.correct-answer{border-color:var(--success);background:#dcfce7}
.options li.wrong-answer{border-color:var(--danger);background:#fee2e2}
.options li .opt-label{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--border);font-size:12px;font-weight:700;flex-shrink:0}
.options li.selected .opt-label{background:var(--primary);color:#fff}
.options li.correct-answer .opt-label{background:var(--success);color:#fff}
.options li.wrong-answer .opt-label{background:var(--danger);color:#fff}
.answer-area{margin-top:10px}
.answer-area textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;resize:vertical;min-height:80px;font-family:inherit}
.answer-area textarea:focus{outline:none;border-color:var(--primary)}
.show-answer{margin-top:10px;padding:10px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:13px;color:#166534;display:none}
.show-answer.visible{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.quiz-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#f1f5f9;border-radius:8px;padding:4px}
.tab{padding:8px 18px;border-radius:6px;font-size:14px;cursor:pointer;transition:all .15s;color:var(--text-secondary)}
.tab.active{background:var(--card);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}

/* Filter */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);transition:all .15s}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Section title */
.section-title{font-size:22px;font-weight:700;margin-bottom:20px;color:var(--text);display:flex;align-items:center;gap:10px}
.section-title .icon{font-size:24px}

/* Download section */
.download-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:16px 0}
.download-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;transition:all .15s}
.download-item:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(37,99,235,.08)}
.download-item .dl-icon{font-size:24px}
.download-item .dl-info h5{font-size:13px;margin-bottom:2px}
.download-item .dl-info p{font-size:11px;color:var(--text-secondary)}

/* Print */
@media print{.sidebar,.menu-toggle{display:none!important}.main{margin-left:0!important}.content{max-width:100%;padding:20px}}

/* Responsive */
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.menu-toggle{display:block}
.main{margin-left:0}
.content{padding:20px 16px 60px}
.hero{padding:28px 20px}
.hero h2{font-size:22px}
.stats{gap:12px}
.stat{min-width:90px;padding:10px 14px}
.chapter-grid{grid-template-columns:1fr}
.quiz-header{flex-direction:column;align-items:flex-start}
.progress-bar{width:100%}
}

/* Scrollbar */
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* Table */
.compare-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.compare-table th,.compare-table td{border:1px solid var(--border);padding:10px 12px;text-align:left}
.compare-table th{background:#f1f5f9;font-weight:600;color:var(--text)}
.compare-table td{color:var(--text-secondary)}
</style>
</head>
<body>

<div class="app">

  <div class="sidebar-header">

    <p>&#25968;&#25454;&#25366;&#25496;&#21407;&#29702;&#19982;&#24212;&#29992;&#65288;&#33883;&#19996;&#26093;&#65289;</p>

<script>
// ========== State ==========
let currentPage = 'home';
let currentChapter = 0;
let quizState = { answers: {}, submitted: false, type: '', num: 0 };

// ========== Navigation ==========
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function setActiveNav(text) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.textContent.trim().includes(text)) el.classList.add('active');
  });
}

function showPage(page) {
  currentPage = page;
  document.getElementById('sidebar').classList.remove('open');
  const c = document.getElementById('content');
  if (page === 'home') { c.innerHTML = renderHome(); setActiveNav('首页'); }
  else if (page === 'outline') { c.innerHTML = renderOutline(); setActiveNav('大纲'); }
  else if (page === 'downloads') { c.innerHTML = renderDownloads(); setActiveNav('下载'); }
  window.scrollTo(0, 0);
}

function showChapter(num) {
  currentChapter = num;
  currentPage = 'chapter';
  document.getElementById('sidebar').classList.remove('open');
  setActiveNav('第' + num + '章');
  document.getElementById('content').innerHTML = renderChapter(num);
  window.scrollTo(0, 0);
}

function showQuiz(type, num) {
  quizState = { answers: {}, submitted: false, type: type, num: num, filter: 'all' };
  currentPage = 'quiz';
  document.getElementById('sidebar').classList.remove('open');
  const label = type === 'chapter' ? '第' + num + '章测试' : '模拟真题' + (num === 1 ? '一' : '二');
  setActiveNav(label);
  document.getElementById('content').innerHTML = renderQuiz();
  window.scrollTo(0, 0);
}

// ========== Renderers ==========
function renderHome() {
  return `
  <div class="fade-in">
    <div class="hero">
      <h2>&#25968;&#25454;&#25366;&#25496;&#26399;&#26411;&#22797;&#20064;&#31449;</h2>
      <p>&#22522;&#20110;&#12298;&#25968;&#25454;&#25366;&#25496;&#21407;&#29702;&#19982;&#24212;&#29992;&#12299;&#65288;&#33883;&#19996;&#26093;&#65289; - 8&#31456;&#30693;&#35782;&#28857; + 246&#36947;&#32451;&#20064;&#39064;</p>
      <div class="stats">
        <div class="stat"><div class="stat-num">8</div><div class="stat-label">&#31456;&#33410;&#30693;&#35782;&#28857;</div></div>
        <div class="stat"><div class="stat-num">160</div><div class="stat-label">&#31456;&#33410;&#27979;&#35797;&#39064;</div></div>
        <div class="stat"><div class="stat-num">86</div><div class="stat-label">&#27169;&#25311;&#30495;&#39064;</div></div>
        <div class="stat"><div class="stat-num">246</div><div class="stat-label">&#24635;&#39064;&#37327;</div></div>
      </div>
    </div>
    <div class="section-title"><span class="icon">&#128218;</span> &#31456;&#33410;&#30693;&#35782;&#28857;</div>
    <div class="chapter-grid">
      ${chapterData.map((ch, i) => `
      <div class="chapter-card" onclick="showChapter(${i + 1})">
        <div class="num">${i + 1}</div>
        <h4>${ch.title}</h4>
        <p>${ch.subtitle}</p>
      </div>`).join('')}
    </div>
    <div class="section-title" style="margin-top:32px"><span class="icon">&#9997;&#65039;</span> &#27169;&#25311;&#30495;&#39064;</div>
    <div class="chapter-grid">
      <div class="chapter-card" onclick="showQuiz('exam',1)">
        <div class="num">&#9733;</div>
        <h4>&#27169;&#25311;&#30495;&#39064;&#19968;</h4>
        <p>&#21333;&#36873;20&#39064; + &#22635;&#31354;10&#39064; + &#21028;&#26029;10&#39064; + &#31616;&#31572;3&#39064;</p>
      </div>
      <div class="chapter-card" onclick="showQuiz('exam',2)">
        <div class="num">&#9733;</div>
        <h4>&#27169;&#25311;&#30495;&#39064;&#20108;</h4>
        <p>&#21333;&#36873;20&#39064; + &#22635;&#31354;10&#39064; + &#21028;&#26029;10&#39064; + &#31616;&#31572;3&#39064;</p>
      </div>
    </div>
  </div>`;
}

function renderChapter(num) {
  const ch = chapterData[num - 1];
  return `<div class="fade-in">
    <div style="margin-bottom:16px">
      <button class="btn btn-outline btn-sm" onclick="showPage('home')">&#8592; &#36820;&#22238;&#39318;&#39029;</button>
      <button class="btn btn-outline btn-sm" style="margin-left:6px" onclick="showQuiz('chapter',${num})">&#21435;&#20570;&#31532;${num}&#31456;&#27979;&#35797; &#8594;</button>
    </div>
    <div class="card">
      <h3>&#31532;${num}&#31456; ${ch.title}</h3>
      <p style="color:var(--text-secondary);margin-bottom:20px">${ch.subtitle}</p>
      ${ch.content}
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      ${num > 1 ? `<button class="btn btn-outline" onclick="showChapter(${num-1})">&#8592; &#19978;&#19968;&#31456;</button>` : ''}
      ${num < 8 ? `<button class="btn btn-primary" onclick="showChapter(${num+1})">&#19979;&#19968;&#31456; &#8594;</button>` : `<button class="btn btn-primary" onclick="showQuiz('exam',1)">&#21435;&#20570;&#27169;&#25311;&#30495;&#39064; &#8594;</button>`}
    </div>
  </div>`;
}

function renderOutline() {
  return `<div class="fade-in">
    <div class="section-title"><span class="icon">&#128196;</span> &#22823;&#32434;&#24635;&#35272;</div>
    <div class="card">${outlineHTML}</div>
  </div>`;
}

function renderDownloads() {
  return `<div class="fade-in">
    <div class="section-title"><span class="icon">&#128229;</span> &#19979;&#36733;&#22797;&#20064;&#36164;&#26009;</div>
    <div class="card">
      <h3>&#21407;&#22987;&#25991;&#20214;&#19979;&#36733;</h3>
      <p>&#20197;&#19979;&#25991;&#20214;&#20648;&#23384;&#22312;&#20179;&#24211;&#20013;&#65292;&#28857;&#20987;&#21363;&#21487;&#19979;&#36733;&#65306;</p>
      <div class="download-grid">
        ${downloadFiles.map(f => `
        <a class="download-item" href="${f.path}" download>
          <div class="dl-icon">${f.icon}</div>
          <div class="dl-info"><h5>${f.name}</h5><p>${f.desc}</p></div>
        </a>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>&#32593;&#39029;&#31163;&#32447;&#29256;</h3>
      <p>&#26412;&#32593;&#39029;&#20026;&#21333;&#25991;&#20214;&#24212;&#29992;&#65292;&#21487;&#30452;&#25509;&#20445;&#23384;&#21040;&#26412;&#22320;&#31163;&#32447;&#20351;&#29992;&#12290;&#25353; Ctrl+S &#20445;&#23384;&#26412;&#39029;&#65292;&#37197;&#21512; data.js &#19968;&#36215;&#20445;&#23384;&#21363;&#21487;&#12290;</p>
    </div>
  </div>`;
}

// ========== Quiz Renderer ==========
function getQuizQuestions() {
  const src = quizState.type === 'chapter' ? chapterQuizzes : examQuizzes;
  return src[quizState.num - 1].questions;
}

function renderQuiz() {
  const src = quizState.type === 'chapter' ? chapterQuizzes : examQuizzes;
  const quiz = src[quizState.num - 1];
  const questions = quiz.questions;
  const filtered = quizState.filter === 'all' ? questions : questions.filter(q => q.type === quizState.filter);
  const answered = Object.keys(quizState.answers).length;
  const total = questions.length;

  return `<div class="fade-in">
    <div style="margin-bottom:16px">
      <button class="btn btn-outline btn-sm" onclick="showPage('home')">&#8592; &#36820;&#22238;&#39318;&#39029;</button>
    </div>
    <div class="section-title"><span class="icon">&#9997;&#65039;</span> ${quiz.title}</div>
    <div class="quiz-header">
      <div class="quiz-progress">
        <span>&#24050;&#31572; ${answered}/${total}</span>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${answered/total*100}%"></div></div>
      </div>
      <div class="quiz-actions">
        ${!quizState.submitted ? `<button class="btn btn-primary" onclick="submitQuiz()">&#25552;&#20132;&#31572;&#26696;</button>` : `<button class="btn btn-success" onclick="showQuiz('${quizState.type}',${quizState.num})">&#37325;&#26032;&#20570;</button>`}
        <button class="btn btn-outline" onclick="toggleAllAnswers()">&#26597;&#30475;&#20840;&#37096;&#31572;&#26696;</button>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-chip ${quizState.filter==='all'?'active':''}" onclick="setFilter('all')">&#20840;&#37096; (${questions.length})</span>
      <span class="filter-chip ${quizState.filter==='choice'?'active':''}" onclick="setFilter('choice')">&#21333;&#36873; (${questions.filter(q=>q.type==='choice').length})</span>
      <span class="filter-chip ${quizState.filter==='judge'?'active':''}" onclick="setFilter('judge')">&#21028;&#26029; (${questions.filter(q=>q.type==='judge').length})</span>
      <span class="filter-chip ${quizState.filter==='fill'?'active':''}" onclick="setFilter('fill')">&#22635;&#31354; (${questions.filter(q=>q.type==='fill').length})</span>
      <span class="filter-chip ${quizState.filter==='essay'?'active':''}" onclick="setFilter('essay')">&#31616;&#31572; (${questions.filter(q=>q.type==='essay').length})</span>
    </div>
    ${quizState.submitted ? `<div class="card" style="margin-bottom:16px"><h3>&#24471;&#20998;&#32467;&#26524;</h3>${renderScore(quiz)}</div>` : ''}
    <div id="quiz-questions">${filtered.map((q, i) => renderQuestion(q, questions.indexOf(q))).join('')}</div>
  </div>`;
}

function renderScore(quiz) {
  const questions = quiz.questions;
  let correct = 0, total = 0;
  questions.forEach((q, i) => {
    if (q.type === 'essay') return;
    total++;
    if (quizState.answers[i] !== undefined && checkAnswer(q, quizState.answers[i])) correct++;
  });
  return `<p style="font-size:24px;font-weight:700;color:var(--primary)">${correct} / ${total}</p>
    <p style="color:var(--text-secondary)">&#27491;&#30830;&#29575;: ${total > 0 ? Math.round(correct/total*100) : 0}%</p>`;
}

function checkAnswer(q, answer) {
  if (q.type === 'choice') return answer === q.answer;
  if (q.type === 'judge') return answer === q.answer;
  if (q.type === 'fill') {
    const a = String(answer).trim().toLowerCase();
    const correct = String(q.answer).trim().toLowerCase();
    const alts = q.alternatives || [];
    return a === correct || alts.some(alt => a === alt.toLowerCase());
  }
  return false;
}

function renderQuestion(q, idx) {
  const typeLabels = { choice: '&#21333;&#36873;', judge: '&#21028;&#26029;', fill: '&#22635;&#31354;', essay: '&#31616;&#31572;' };
  const typeClass = q.type;
  const answered = quizState.answers[idx] !== undefined;
  let stateClass = '';
  if (quizState.submitted && q.type !== 'essay') {
    stateClass = checkAnswer(q, quizState.answers[idx]) ? 'correct' : 'wrong';
  }

  let body = '';
  if (q.type === 'choice') {
    body = `<ul class="options">${q.options.map((opt, oi) => {
      const label = String.fromCharCode(65 + oi);
      let cls = '';
      if (quizState.answers[idx] === label) cls += ' selected';
      if (quizState.submitted) {
        if (label === q.answer) cls += ' correct-answer';
        else if (quizState.answers[idx] === label && label !== q.answer) cls += ' wrong-answer';
      }
      return `<li class="${cls}" onclick="selectOption(${idx},'${label}')"><span class="opt-label">${label}</span>${opt}</li>`;
    }).join('')}</ul>`;
  } else if (q.type === 'judge') {
    const sel = quizState.answers[idx];
    body = `<ul class="options">
      <li class="${sel==='#23545;'?'selected':''} ${quizState.submitted&&q.answer==='#23545;'?'correct-answer':''} ${quizState.submitted&&sel==='#23545;'&&q.answer!=='#23545;'?'wrong-answer':''}" onclick="selectOption(${idx},'#23545;')"><span class="opt-label">&#10003;</span>&#23545;</li>
      <li class="${sel==='#38169;'?'selected':''} ${quizState.submitted&&q.answer==='#38169;'?'correct-answer':''} ${quizState.submitted&&sel==='#38169;'&&q.answer!=='#38169;'?'wrong-answer':''}" onclick="selectOption(${idx},'#38169;')"><span class="opt-label">&#10007;</span>&#38169;</li>
    </ul>`;
  } else if (q.type === 'fill') {
    body = `<div class="answer-area"><input type="text" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px" placeholder="&#36755;&#20837;&#31572;&#26696;..." value="${quizState.answers[idx]||''}" onchange="setAnswer(${idx},this.value)" ${quizState.submitted?'disabled':''}></div>`;
  } else if (q.type === 'essay') {
    body = `<div class="answer-area"><textarea placeholder="&#20889;&#19979;&#20320;&#30340;&#31572;&#26696;..." onchange="setAnswer(${idx},this.value)" ${quizState.submitted?'disabled':''}>${quizState.answers[idx]||''}</textarea></div>`;
  }

  return `<div class="question-card ${stateClass}">
    <span class="q-type ${typeClass}">${typeLabels[q.type]}</span>
    ${q.focus ? `<span style="float:right;font-size:11px;color:var(--text-secondary)">&#32771;&#28857;: ${q.focus}</span>` : ''}
    <div class="q-num">&#31532; ${idx + 1} &#39064;</div>
    <div class="q-text">${q.question}</div>
    ${body}
    <div class="show-answer ${quizState.submitted || showAllAnswers ? 'visible' : ''}" id="ans-${idx}">
      <strong>&#21442;&#32771;&#31572;&#26696;&#65306;</strong>${q.type === 'judge' ? (q.answer === '#23545;' ? '&#23545;' : '&#38169;') : q.answer}
      ${q.explanation ? '<br><em>' + q.explanation + '</em>' : ''}
    </div>
  </div>`;
}

let showAllAnswers = false;
function toggleAllAnswers() {
  showAllAnswers = !showAllAnswers;
  document.querySelectorAll('.show-answer').forEach(el => {
    el.classList.toggle('visible', showAllAnswers || quizState.submitted);
  });
}

function selectOption(idx, val) {
  if (quizState.submitted) return;
  quizState.answers[idx] = val;
  refreshQuiz();
}
function setAnswer(idx, val) {
  quizState.answers[idx] = val;
}
function setFilter(f) {
  quizState.filter = f;
  refreshQuiz();
}
function refreshQuiz() {
  document.getElementById('content').innerHTML = renderQuiz();
}
function submitQuiz() {
  quizState.submitted = true;
  refreshQuiz();
  window.scrollTo(0, 0);
}

// ========== Init ==========
showPage('home');

// Close sidebar on outside click (mobile)
document.querySelector('.main').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
});
</script>
</body>
</html>
